name: Build Debian sid images

on:
  push:
    paths:
      - .github/**
      - .gitignore
      - config/**
      - packaging/**
      - scripts/**
  pull_request:
    paths:
      - .github/**
      - .gitignore
      - config/**
      - packaging/**
      - scripts/**
  workflow_dispatch:
    inputs:
      kernel_jobs:
        description: Parallel kernel compilation jobs
        type: choice
        default: '8'
        options:
          - '4'
          - '8'
          - '16'
      upload_firmware_artifacts:
        description: Upload images/packages (only after reviewing firmware redistribution rights)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Validate build scripts and workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check shell scripts and ignore rules
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          for script in packaging/*; do
            sh -n "$script"
          done
          shellcheck scripts/*.sh
          shellcheck -e SC1091,SC2154 packaging/*
          for ignored_path in work/linux/Makefile artifacts/test.img .env signing_key.pem; do
            git check-ignore -q "$ignored_path"
          done

      - name: Validate GitHub Actions configuration
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fLsS --retry 3 --max-time 120 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  images:
    name: Build and boot-test CLI and KDE
    needs: lint
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, X64, ux3607-builder]
    timeout-minutes: 1440
    concurrency:
      group: ux3607-images-${{ github.repository }}
      cancel-in-progress: false
    env:
      JOBS: ${{ inputs.kernel_jobs }}
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check dedicated runner capacity
        run: |
          sudo -n true
          if ! grep -qx 'ID=debian' /etc/os-release; then
            printf '::error::Use a dedicated Debian sid amd64 runner.\n'
            exit 1
          fi
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          memory_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          if (( available_kib < 100 * 1024 * 1024 || memory_kib < 16 * 1024 * 1024 )); then
            printf '::error::The build needs 100 GiB free disk and at least 16 GiB RAM.\n'
            exit 1
          fi
          mkdir -p ci-logs
          df -h .
          free -h

      - name: Install Debian build dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev libdw-dev pahole pkg-config \
            debhelper dpkg-dev python3 rsync kmod cpio xz-utils zstd \
            mmdebstrap dosfstools gdisk util-linux udev e2fsprogs \
            device-tree-compiler ca-certificates curl git 7zip file \
            qemu-user qemu-user-binfmt binfmt-support qemu-system-arm qemu-efi-aarch64 \
            expect shellcheck
          sudo -n update-binfmts --enable qemu-aarch64
          grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          sudo -n unshare --mount --propagation private true
          sudo -n losetup --find

      - name: Build Debian-derived kernel package
        run: bash scripts/build-kernel.sh 2>&1 | tee ci-logs/kernel-build.log

      - name: Build board firmware and boot-support packages
        run: |
          bash scripts/build-firmware-package.sh 2>&1 | tee ci-logs/firmware-build.log
          bash scripts/build-support-package.sh 2>&1 | tee ci-logs/support-build.log

      - name: Build CLI image
        run: bash scripts/build-images.sh cli 2>&1 | tee ci-logs/cli-build.log

      - name: Validate CLI filesystem and text boot
        run: |
          bash scripts/verify-image.sh cli 2>&1 | tee artifacts/cli-disk-check.log
          expect scripts/test-uefi.exp cli

      - name: Derive KDE image from CLI
        run: bash scripts/build-images.sh kde 2>&1 | tee ci-logs/kde-build.log

      - name: Validate KDE filesystem and text boot
        run: |
          bash scripts/verify-image.sh kde 2>&1 | tee artifacts/kde-disk-check.log
          expect scripts/test-uefi.exp kde

      - name: Compress images and record checksums
        run: |
          for variant in cli kde; do
            zstd -T4 -10 --keep "artifacts/debian-sid-ux3607oa-$variant.img"
            zstd --test "artifacts/debian-sid-ux3607oa-$variant.img.zst"
          done
          cd artifacts
          sha256sum ./*.img ./*.img.zst packages/*.deb kernel/* > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux3607oa-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            artifacts/*-boot.log
            artifacts/*-disk-check.log
            artifacts/*-packages.tsv
            artifacts/board-firmware-sha256.txt
            artifacts/kernel/debian-config-delta.txt
            artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware-containing images and packages
        if: success() && inputs.upload_firmware_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux3607oa-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.img.zst
            artifacts/packages/
            artifacts/kernel/
            artifacts/*-packages.tsv
            artifacts/board-firmware-sha256.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize verified build
        if: success()
        env:
          UPLOAD_IMAGES: ${{ inputs.upload_firmware_artifacts }}
        run: |
          {
            printf '## Debian sid UX3607OA images\n\n'
            printf 'CLI and KDE disk checks and text-only QEMU UEFI USB boot tests passed.\n\n'
            printf 'Graphics and physical Qualcomm hardware require testing on the laptop.\n\n'
            printf 'Firmware-containing upload enabled: %s.\n\n' "$UPLOAD_IMAGES"
            printf 'Runner output directory: %s/artifacts. Outputs remain until the next checkout.\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean generated privileged build trees
        if: always()
        run: |
          sudo -n rm -rf --one-file-system -- "${GITHUB_WORKSPACE:?}/work"